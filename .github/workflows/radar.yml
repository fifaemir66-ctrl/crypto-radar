name: ZoneHunter

on:
  schedule:
    - cron: "5 * * * *"   # elk uur, 5 minuten over het hele uur (UTC)
  workflow_dispatch:       # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # always the newest commit, also for queued runs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Use the latest state
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - name: Tests (stop here if the code is broken, so no wrong alerts go out)
        run: python -m unittest discover tests

      - name: Analysis and alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save data
        run: |
          git config user.name "zonehunter-bot"
          git config user.email "zonehunter-bot@users.noreply.github.com"
          git add docs/data.json docs/charts state.json
          git diff --staged --quiet && exit 0
          git commit -m "ZoneHunter update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: Tell me when a run fails (otherwise the site silently goes stale)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: ⚠️ ZoneHunter run failed" -H "Tags: warning" \
            -d "A ZoneHunter run failed. Open the Actions tab on GitHub to see why." "https://ntfy.sh/$NTFY_TOPIC" || true

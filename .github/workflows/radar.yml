name: Crypto Radar

on:
  schedule:
    - cron: "5 * * * *"   # elk uur, 5 minuten over het hele uur (UTC)
  workflow_dispatch:       # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analyse en meldingen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Data opslaan
        run: |
          git config user.name "crypto-radar-bot"
          git config user.email "crypto-radar-bot@users.noreply.github.com"
          git add docs/data.json docs/charts state.json
          git diff --staged --quiet || (git commit -m "Radar-update $(date -u +'%Y-%m-%d %H:%M')" && git push)
